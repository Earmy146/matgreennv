services:
  redis:
    image: redis:7-alpine
    container_name: matgreen_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes --appendfsync everysec --loglevel warning --maxmemory 128mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - matgreen_net

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: matgreen_backend
    restart: unless-stopped
    env_file:
      - path: ./be/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000}
      - IMAGE_STORAGE_PROVIDER=${IMAGE_STORAGE_PROVIDER:-local}
      - LOCAL_UPLOAD_DIR=/app/uploads
      - UPLOAD_MAX_IMAGE_SIZE_BYTES=${UPLOAD_MAX_IMAGE_SIZE_BYTES:-10485760}
    volumes:
      - material_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - matgreen_net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: matgreen_ai_service
    restart: unless-stopped
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      - BACKEND_BASE_URL=http://backend:5000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - matgreen_net
      - cliproxyapi_net

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_AI_BASE_URL=/ai-api
    container_name: matgreen_frontend
    restart: unless-stopped
    ports:
      # Mặc định cổng 8082 trên VPS để không xung đột với cổng 80 của finance-app
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - backend
      - ai-service
    networks:
      - matgreen_net

volumes:
  redis_data:
  material_uploads:

networks:
  matgreen_net:
    driver: bridge
  cliproxyapi_net:
    external: true
    name: cliproxyapi_default
