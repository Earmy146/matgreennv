services:
  redis:
    image: redis:7-alpine
    container_name: matgreen_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - matgreen_net

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: matgreen_backend
    restart: unless-stopped
    env_file:
      - path: ./be/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - LOCAL_UPLOAD_DIR=/app/uploads
    volumes:
      - material_uploads:/app/uploads
    depends_on:
      - redis
    networks:
      - matgreen_net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: matgreen_ai_service
    restart: unless-stopped
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      - BACKEND_BASE_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - matgreen_net

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_AI_BASE_URL=/ai-api
    container_name: matgreen_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-service
    networks:
      - matgreen_net

volumes:
  redis_data:
  material_uploads:

networks:
  matgreen_net:
    driver: bridge
