<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradient xanh ngọc lục bảo tuần hoàn -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gradient bóng đổ tạo chiều sâu cho khối vật liệu -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="darkAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- BIỂU TƯỢNG (ICON MARK): Khối vật liệu xây dựng (M) kết hợp chiếc lá & vòng tuần hoàn vô cực -->
  <g transform="translate(20, 10)" filter="url(#subtleShadow)">
    <!-- Vòng cung tuần hoàn bên trái (Hình cánh lá sinh thái) -->
    <path d="M 50 10 C 22 10 10 32 10 55 C 10 78 28 95 50 95 C 65 95 76 86 82 74 C 74 74 65 71 58 64 C 48 54 46 38 52 26 C 54 22 56 16 50 10 Z" fill="url(#emeraldGrad)" />

    <!-- Cánh cung tuần hoàn bên phải uốn cong tạo thành chữ M (Material & Möbius) -->
    <path d="M 50 95 C 78 95 90 73 90 50 C 90 27 72 10 50 10 C 40 10 32 14 26 21 C 34 20 44 24 50 31 C 60 42 61 58 54 70 C 51 76 45 84 50 95 Z" fill="url(#leafGrad)" />

    <!-- Khối mầm lá trung tâm (Tượng trưng cho sự tái sinh tài nguyên) -->
    <path d="M 50 25 C 62 38 60 58 48 68 C 40 56 42 38 50 25 Z" fill="url(#darkAccent)" opacity="0.9" />

    <!-- Điểm định vị Radar GPS trung tâm (Công nghệ MatGreen) -->
    <circle cx="50" cy="52" r="5" fill="#ffffff" />
    <circle cx="50" cy="52" r="9" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.75" />
  </g>

  <!-- TYPOGRAPHY: Tên thương hiệu MatGreen & Khẩu hiệu -->
  <g transform="translate(138, 20)">
    <!-- Chữ "Mat" - Dày dặn, vững chãi như khối vật liệu xây dựng -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="46" font-weight="900" fill="#0f172a" letter-spacing="-1">Mat</text>

    <!-- Chữ "Green" - Màu xanh ngọc lục bảo tuần hoàn tươi mới -->
    <text x="96" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="46" font-weight="900" fill="url(#emeraldGrad)" letter-spacing="-1">Green</text>

    <!-- Dấu chấm sinh thái công nghệ -->
    <circle cx="242" cy="48" r="4.5" fill="#10b981" />

    <!-- Đường phân cách tinh tế -->
    <line x1="1" y1="67" x2="240" y2="67" stroke="#e2e8f0" stroke-width="1.2" />

    <!-- Slogan phụ: Khẳng định định vị tuần hoàn vật liệu -->
    <text x="1" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#059669" letter-spacing="2.8">TUẦN HOÀN VẬT LIỆU XÂY DỰNG</text>
  </g>
</svg>
