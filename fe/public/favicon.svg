<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="iconEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="iconBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Nền bo góc mềm cao cấp (Squircle) -->
  <rect width="120" height="120" rx="30" fill="url(#bgGrad)" />

  <!-- Biểu tượng MatGreen tuần hoàn -->
  <g transform="translate(15, 15)" filter="url(#glow)">
    <!-- Cánh lá tuần hoàn trái -->
    <path d="M 45 8 C 18 8 8 28 8 48 C 8 68 24 82 45 82 C 58 82 68 74 73 63 C 65 63 57 60 51 54 C 42 45 40 32 45 22 C 48 18 50 13 45 8 Z" fill="url(#iconEmerald)" />

    <!-- Cánh lá tuần hoàn phải -->
    <path d="M 45 82 C 70 82 82 62 82 43 C 82 23 66 8 45 8 C 36 8 28 12 23 18 C 30 17 38 20 44 26 C 53 36 54 50 48 61 C 45 66 40 73 45 82 Z" fill="url(#iconBright)" />

    <!-- Tâm tái sinh -->
    <path d="M 45 22 C 55 33 53 50 43 59 C 36 48 38 33 45 22 Z" fill="#064e3b" opacity="0.95" />

    <!-- Radar định vị GPS -->
    <circle cx="45" cy="45" r="4.5" fill="#ffffff" />
    <circle cx="45" cy="45" r="8.5" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.8" />
  </g>
</svg>
